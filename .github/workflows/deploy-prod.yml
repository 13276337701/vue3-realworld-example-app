name: deploy vue
on:
  push:
    branches:
      - master
jobs:
  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - name: check out the code to build server
        uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      
      - name: build the code
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
      
      # 第一步：先清空服务器上的目标目录
      - name: Clean remote directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{secrets.HOST}}
          username: ${{secrets.SSH_USER_NAME}}
          key: ${{secrets.SSH_KEY}}
          script: |
            # 删除旧文件
            rm -rf /var/www/html/*
            # 确保目录存在且权限正确
            mkdir -p /var/www/html
            chmod 755 /var/www/html
      
      # 第二步：复制新文件
      - name: copy file to server
        uses: appleboy/scp-action@master
        with:
          host: ${{secrets.HOST}}
          username: ${{secrets.SSH_USER_NAME}}
          key: ${{secrets.SSH_KEY}}
          source: "dist/*"
          target: "/var/www/html"
          strip_components: 1
          # 添加 tar 参数避免权限和时间戳问题
          tar_exec: "tar --no-same-owner --no-same-permissions --touch"
